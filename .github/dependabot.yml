version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Avalonia's packages only work at the same version, so they're bumped together in one pull request.
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
