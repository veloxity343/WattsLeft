name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Native AOT compiles for Windows only on Windows: it links with Visual Studio's tools, which the runner has.
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      PROJECT: src/WattsLeft/WattsLeft.csproj
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build everything
        run: dotnet build WattsLeft.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      # One native executable, with .NET compiled in: nothing to install. Avalonia's drawing libraries (Skia,
      # HarfBuzz) are native DLLs that sit beside it.
      - name: Publish
        run: >
          dotnet publish "$PROJECT" -c Release -r win-x64 -o out/app
          -p:Version=${{ steps.version.outputs.version }} -p:PublishAot=true

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory dist | Out-Null
          $files = Get-ChildItem out/app -File | Where-Object { $_.Extension -ne '.pdb' }
          $zip = "dist/WattsLeft-$v-win-x64.zip"
          Compress-Archive -Path $files.FullName -DestinationPath $zip
          # The zip's SHA-256, which the app checks a downloaded update against before installing it.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii -Path "$zip.sha256" -Value "$hash  $(Split-Path $zip -Leaf)"
          Get-ChildItem out/app, dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: WattsLeft-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256

  # Runs what was just built on a clean Windows machine, as a user would: it lists devices (none on the runner)
  # and draws every page of the settings window. Catches a build that starts but breaks, such as something the
  # native compiler left out, before it can be released.
  test:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Run the download
        shell: pwsh
        run: |
          $failed = $false
          foreach ($zip in Get-ChildItem dist/*.zip) {
            # The app refuses an update whose checksum doesn't match, so check it here first.
            $sum = Get-Content -Raw "$($zip.FullName).sha256" -ErrorAction SilentlyContinue
            if (-not $sum -or $sum.Substring(0, 64) -ne (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) {
              Write-Host "::error::$($zip.Name) has no matching .sha256, which updating from the app needs"
              $failed = $true
            }
            $dir = Join-Path $PWD $zip.BaseName
            Expand-Archive $zip.FullName -DestinationPath $dir
            $exe = Join-Path $dir WattsLeft.exe
            foreach ($run in @(@('--list'), @('--preview-settings', (Join-Path $dir 'settings.png')))) {
              $p = Start-Process $exe -ArgumentList $run -PassThru -WindowStyle Hidden
              if (-not $p.WaitForExit(120000)) {
                $p.Kill()
                Write-Host "::error::$($zip.Name) $($run[0]) didn't finish in 2 minutes (an error dialog, or hung)"
                $failed = $true
              } elseif ($p.ExitCode -ne 0) {
                Write-Host "::error::$($zip.Name) $($run[0]) exited with $($p.ExitCode)"
                $failed = $true
              } else {
                Write-Host "$($zip.Name) $($run[0]): ok"
              }
            }
            if (-not (Test-Path (Join-Path $dir 'settings.png'))) {
              Write-Host "::error::$($zip.Name) drew no settings preview"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: settings-previews
          path: "*/settings.png"

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it clears the workspace, which would delete a download made before it.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The release notes are this version's section of CHANGELOG.md. A full release without one stops here
      # rather than publishing empty notes; pre-releases use the Unreleased section.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() { awk -v h="## [$1]" 'index($0, h) == 1 { found = 1; next } found && (/^## \[/ || /^\[[^]]+\]: /) { exit } found' CHANGELOG.md; }
          notes="$(section "$version")"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            if [[ "$version" == *-* ]]; then
              notes="$(section Unreleased)"
            else
              echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for $version. Add '## [$version] - <date>' with its changes, then push the tag again."
              exit 1
            fi
          fi
          printf '%s\n' "$notes" > release-notes.md
          cat release-notes.md

      # Releases are immutable once published (a repository setting), so nothing can be added to one afterwards.
      # It's made as a draft, the zip attached, and only then published. The notes are the changelog section,
      # followed by GitHub's list of merged pull requests and a comparison link. Tags like v1.2.0-beta.1 become
      # pre-releases.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes "${prerelease[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
